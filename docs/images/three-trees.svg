<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">三棵树：同一个文件可以有三个版本</title><desc id="desc">工作区 C 经 add 保存到 Index；Index B 经 commit 记录为 HEAD 的快照。默认 diff 比较 B 到 C，diff --cached 比较 A 到 B。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1000" height="400" rx="20" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="36" y="52" font-size="26" fill="#0f172a" text-anchor="start" font-weight="600">三棵树：同一个文件可以有三个版本</text>
<rect x="45" y="105" width="230" height="125" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="160.0" y="163.5" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="600">工作区 Work</text>
<text x="160.0" y="194.5" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">当前文件：C</text>
<rect x="385" y="105" width="230" height="125" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="500.0" y="163.5" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="600">暂存区 Index</text>
<text x="500.0" y="194.5" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">准备提交：B</text>
<rect x="725" y="105" width="230" height="125" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="840.0" y="163.5" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="600">当前提交 HEAD</text>
<text x="840.0" y="194.5" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">已经记录：A</text>
<polyline points="275,164 385,164" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="330" y="145" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">add</text>
<polyline points="615,164 725,164" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="670" y="145" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">commit</text>
<text x="330" y="281" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="400">diff：B → C</text>
<text x="670" y="281" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="400">diff --cached：A → B</text>
<text x="500" y="351" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="600">此时提交保存 B，工作文件仍为 C。</text>
</g></svg>
