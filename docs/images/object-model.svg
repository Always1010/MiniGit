<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc">
<title id="title">对象模型：引用找历史，Tree 找文件，Blob 存字节</title><desc id="desc">HEAD 符号指向 main，main 指向 Commit B。B 引用父提交 A 和根 Tree，根 Tree 引用 note.txt 的 Blob 和 src 子 Tree。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1040" height="580" rx="20" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#0f172a">
<text x="36" y="52" font-size="26" fill="#0f172a" text-anchor="start" font-weight="600">对象模型：引用找历史，Tree 找文件，Blob 存字节</text>
<rect x="40" y="100" width="165" height="90" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="122.5" y="141.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="600">HEAD</text>
<text x="122.5" y="172.0" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">当前分支绑定</text>
<rect x="265" y="100" width="180" height="90" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="355.0" y="141.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="600">分支 main</text>
<text x="355.0" y="172.0" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">可移动的引用</text>
<rect x="530" y="100" width="190" height="90" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="625.0" y="141.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="600">Commit B</text>
<text x="625.0" y="172.0" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">快照与元数据</text>
<rect x="805" y="100" width="190" height="90" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
<text x="900.0" y="141.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="600">Commit A</text>
<text x="900.0" y="172.0" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">父提交</text>
<rect x="530" y="270" width="190" height="90" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="625.0" y="311.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="600">根 Tree</text>
<text x="625.0" y="342.0" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">名称、模式、ID</text>
<rect x="345" y="430" width="190" height="90" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="440.0" y="471.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="600">Blob</text>
<text x="440.0" y="502.0" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">note.txt 的字节</text>
<rect x="750" y="430" width="190" height="90" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
<text x="845.0" y="471.0" font-size="21" fill="#0f172a" text-anchor="middle" font-weight="600">子 Tree</text>
<text x="845.0" y="502.0" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">src/ 的条目</text>
<polyline points="205,145 265,145" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="445,145 530,145" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="720,145 805,145" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="762" y="127" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">parent</text>
<polyline points="625,190 625,270" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="658" y="235" font-size="16" fill="#475569" text-anchor="middle" font-weight="400">tree</text>
<polyline points="580,360 580,395 440,395 440,430" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="670,360 670,395 845,395 845,430" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="520" y="558" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="400">同字节可复用 Blob；改名改变 Tree；移动分支不改旧 Commit。</text>
</g></svg>
